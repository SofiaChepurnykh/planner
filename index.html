<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8e63d8">
<title>Планер недели</title>
<style>
:root{--bg:#f4effc;--card:#fff;--text:#2e2342;--muted:#8a7da3;--accent:#8e63d8;--soft:#ece3fb;--line:#e3d8f6;--today:#8e63d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1528;--card:#2a2139;--text:#f0eafc;--muted:#a597c0;--accent:#b794f4;--soft:#382c4d;--line:#43365b;--today:#b794f4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1528;--card:#2a2139;--text:#f0eafc;--muted:#a597c0;--accent:#b794f4;--soft:#382c4d;--line:#43365b;--today:#b794f4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
h1{font-size:22px;margin:0;font-weight:700}
.range{color:var(--muted);font-size:15px;margin:0 0 14px}
.nav{display:flex;gap:6px}
.nav button{border:0;background:var(--soft);color:var(--accent);font-size:20px;width:40px;height:40px;border-radius:12px;cursor:pointer}
.nav .today{width:auto;padding:0 12px;font-size:14px;font-weight:600}
.day{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(120,80,200,.08);border:2px solid transparent}
.day.is-today{border-color:var(--today)}
.dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.dn{font-weight:700;font-size:18px}
.dd{color:var(--muted);font-size:14px;margin-left:8px;font-weight:400}
.cnt{font-size:13px;color:var(--accent);background:var(--soft);padding:2px 10px;border-radius:20px}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);background:transparent;margin:0;cursor:pointer;position:relative}
.chk:checked{background:var(--accent)}
.chk:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tx{flex:1;font-size:16px;line-height:1.4;word-break:break-word;padding-top:1px}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);outline:none}
.add input:focus{border-color:var(--accent)}
.add button{border:0;background:var(--accent);color:#fff;width:44px;border-radius:12px;font-size:22px;cursor:pointer}
.empty{color:var(--muted);font-size:14px;padding:2px 0 4px}
.sync{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
:root{--bar:#8e63d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#1c1528}}
:root[data-theme="dark"]{--bar:#1c1528}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.tools{display:flex;gap:8px;margin-top:18px}
.tools button{flex:1;border:0;background:var(--soft);color:var(--accent);font-size:15px;font-weight:600;padding:12px 8px;border-radius:14px;cursor:pointer}
#boxwrap{display:none;margin-top:10px}
#box{width:100%;height:110px;font-size:16px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
#apply{margin-top:8px;width:100%;border:0;background:var(--accent);color:#fff;font-size:16px;padding:12px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Планер недели</h1>
    <div class="nav">
      <button id="prev" aria-label="Предыдущая неделя">‹</button>
      <button id="now" class="today">Сегодня</button>
      <button id="next" aria-label="Следующая неделя">›</button>
    </div>
  </header>
  <p class="range" id="range"></p>
  <div id="days"></div>
  <div class="tools"><button id="copy">Скопировать данные</button><button id="paste">Вставить данные</button></div>
  <div id="boxwrap"><textarea id="box" placeholder="Вставь сюда скопированные данные"></textarea><button id="apply">Добавить задачи</button></div>
  <div class="sync" id="sync"></div>
</div>
<script>
(function(){
var DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
var MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var KEY="planner-v1";
var state={tasks:{},updated:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.tasks)state=p;}}catch(e){}
var monday=startOfWeek(new Date());
var dbDoc=null,saveTimer=null;

function startOfWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function persist(){
  state.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(dbDoc){clearTimeout(saveTimer);saveTimer=setTimeout(function(){
    dbDoc.set({json:JSON.stringify(state),updated:state.updated}).then(function(){setSync("Сохранено и синхронизировано ✓")}).catch(function(){});
  },700)}
}
function setSync(t){document.getElementById("sync").textContent=t}

function render(){
  var days=document.getElementById("days");days.innerHTML="";
  var end=new Date(monday);end.setDate(end.getDate()+6);
  var r=monday.getDate()+(monday.getMonth()!==end.getMonth()?" "+MON[monday.getMonth()]:"")+"–"+end.getDate()+" "+MON[end.getMonth()]+" "+end.getFullYear();
  document.getElementById("range").textContent=r;
  var todayIso=iso(new Date());
  for(var i=0;i<7;i++){
    (function(i){
      var d=new Date(monday);d.setDate(d.getDate()+i);var k=iso(d);
      var list=state.tasks[k]||[];
      var card=document.createElement("section");card.className="day"+(k===todayIso?" is-today":"");
      var h=document.createElement("div");h.className="dh";
      var l=document.createElement("div");
      var n=document.createElement("span");n.className="dn";n.textContent=DAYS[i];
      var dt=document.createElement("span");dt.className="dd";dt.textContent=d.getDate()+" "+MON[d.getMonth()];
      l.appendChild(n);l.appendChild(dt);h.appendChild(l);
      if(list.length){var c=document.createElement("span");c.className="cnt";c.textContent=list.filter(function(t){return t.d}).length+"/"+list.length;h.appendChild(c)}
      card.appendChild(h);
      if(!list.length){var e=document.createElement("div");e.className="empty";e.textContent="Задач пока нет";card.appendChild(e)}
      list.forEach(function(t){
        var row=document.createElement("div");row.className="task"+(t.d?" done":"");
        var cb=document.createElement("input");cb.type="checkbox";cb.className="chk";cb.checked=!!t.d;
        cb.onchange=function(){t.d=cb.checked;persist();render()};
        var tx=document.createElement("div");tx.className="tx";tx.textContent=t.t;
        var x=document.createElement("button");x.className="del";x.textContent="×";x.setAttribute("aria-label","Удалить");
        x.onclick=function(){state.tasks[k]=list.filter(function(q){return q.id!==t.id});persist();render()};
        row.appendChild(cb);row.appendChild(tx);row.appendChild(x);card.appendChild(row);
      });
      var form=document.createElement("div");form.className="add";
      var inp=document.createElement("input");inp.type="text";inp.placeholder="Новая задача…";inp.enterKeyHint="done";
      var btn=document.createElement("button");btn.textContent="+";btn.setAttribute("aria-label","Добавить");
      function add(){var v=inp.value.trim();if(!v)return;(state.tasks[k]=state.tasks[k]||[]).push({id:uid(),t:v,d:false});persist();render();
        var cards=document.querySelectorAll(".add input");if(cards[i])cards[i].focus()}
      btn.onclick=add;inp.onkeydown=function(ev){if(ev.key==="Enter")add()};
      form.appendChild(inp);form.appendChild(btn);card.appendChild(form);
      days.appendChild(card);
    })(i);
  }
}
document.getElementById("prev").onclick=function(){monday.setDate(monday.getDate()-7);render()};
document.getElementById("next").onclick=function(){monday.setDate(monday.getDate()+7);render()};
document.getElementById("now").onclick=function(){monday=startOfWeek(new Date());render()};
function flash(t){setSync(t);setTimeout(function(){setSync(dbDoc?"Синхронизация включена ✓":"Сохраняется на этом устройстве")},3500)}
function mergeText(txt){
  try{
    var rs=JSON.parse(txt);if(!rs||!rs.tasks)throw 0;
    var added=0;
    Object.keys(rs.tasks).forEach(function(k){
      var cur=state.tasks[k]=state.tasks[k]||[];
      (rs.tasks[k]||[]).forEach(function(t){if(t&&t.id&&!cur.some(function(c){return c.id===t.id})){cur.push(t);added++}});
    });
    persist();render();
    document.getElementById("boxwrap").style.display="none";document.getElementById("box").value="";
    flash("Добавлено задач: "+added+" ✓");
  }catch(e){flash("Не получилось: это не данные планера")}
}
document.getElementById("copy").onclick=function(){
  var txt=JSON.stringify(state);
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");flash("Данные скопированы ✓")}catch(e){flash("Не удалось скопировать")}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){flash("Данные скопированы ✓")}).catch(fallback)}else fallback();
};
document.getElementById("paste").onclick=function(){
  function manual(){document.getElementById("boxwrap").style.display="block";document.getElementById("box").focus()}
  if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){if(t&&t.indexOf("tasks")>-1)mergeText(t);else manual()}).catch(manual)}else manual();
};
document.getElementById("apply").onclick=function(){mergeText(document.getElementById("box").value)};
render();
setSync("Сохраняется на этом устройстве");

// Optional sync between devices (only if the viewer is signed in)
function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var user=await withTimeout(claude.use("user"),10000);
    var db=await withTimeout(claude.use("db"),10000);
    if(!user||!db)return;
    var id=await user.id();if(!id)return;
    var doc=db.collection("data/users/"+id).doc("planner");
    var snap=await doc.get();
    if(snap.exists){
      var rd=snap.data()||{};
      if(rd.json&&(rd.updated||0)>(state.updated||0)){
        var rs=JSON.parse(rd.json);if(rs&&rs.tasks){state=rs;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()}
      }
    }
    dbDoc=doc;
    if((state.updated||0)>0&&(!snap.exists||(snap.data().updated||0)<state.updated)){
      doc.set({json:JSON.stringify(state),updated:state.updated}).catch(function(){});
    }
    setSync("Синхронизация включена ✓");
  }catch(e){}
})();
})();
</script>
</body>
</html>
